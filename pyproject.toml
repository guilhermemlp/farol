[project]
name = "farol"
version = "0.1.0"
description = "Sinal diário de recuperação e carga de treino a partir dos seus dados do Garmin."
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.2.24,<0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
]

[project.scripts]
farol-ingest = "farol.pipeline.ingest:main"
farol-today = "farol.reports.today:main"
farol-daily = "farol.reports.daily:main"
farol-splits = "farol.pipeline.splits:main"
farol-state = "farol.domain.state:main"
farol-daily-analysis = "farol.reports.daily_analysis:main"
farol-calibration = "farol.insights.calibration:main"
farol-calibration-auto = "farol.insights.calibration_auto:main"
farol-correlations = "farol.insights.correlations:main"
farol-calibration-review = "farol.insights.calibration_review:main"
farol-changepoint = "farol.insights.changepoint:main"
farol-decoupling = "farol.insights.decoupling:main"
farol-course = "farol.insights.course:main"
farol-race-conditions = "farol.insights.race_conditions:main"
farol-race-prediction = "farol.insights.race_prediction:main"
farol-dashboard = "farol.reports.dashboard:main"
farol-injuries = "farol.records.injuries:main"
farol-race-log = "farol.records.race_log:main"
farol-reconcile = "farol.pipeline.reconcile:main"
farol-strava-backfill = "farol.pipeline.strava_backfill:main"
farol-running-history = "farol.insights.running_history:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Conjunto padrao do ruff (E4/E7/E9/F): erros de codigo e imports, nao
# estilo. Nao ampliamos para E501 (linha longa) nem para regras de formato
# fora do que o codigo ja segue -- a auditoria F8 pediu CI com ruff, nao
# reformatacao do codigo existente.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farol*"]

[tool.setuptools.package-data]
# CSS embutido no HTML do dashboard em tempo de renderizacao.
"farol.reports" = ["assets/css/*.css"]
